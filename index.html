<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Book Catalogue</title>
    
    <link rel="stylesheet" href="css/style.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>	
</head>

<body>
    
    <header>
        <h1>📚 Nate's Amazing Book Catalogue</h1>
    </header>

	<section id="search-area">
		<input type="text" id="search-input" placeholder="Search for a book or author...">
		<button id="search-button">Search</button>
		<button id="reset-button">Reset</button>
	</section>

    <main id="catalogue-container">
        <h2>Loading Books...</h2>
    </main>
    
    <footer>
        <p>&copy; 2025. Nate's First Coding Project</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
